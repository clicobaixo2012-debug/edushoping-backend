<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EDUSHOPING SaaS - Acesso</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .container { background: #ffffff; width: 100%; max-width: 400px; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
    h2 { text-align: center; color: #333; margin-bottom: 24px; font-weight: 600; }
    .form-group { margin-bottom: 18px; }
    label { display: block; font-size: 14px; font-weight: 600; color: #555; margin-bottom: 6px; }
    input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; outline: none; transition: border-color 0.2s; }
    input:focus { border-color: #007bff; }
    .btn-group { display: flex; gap: 10px; margin-top: 20px; }
    button { flex: 1; padding: 12px; font-size: 14px; font-weight: bold; color: #fff; background-color: #007bff; border: none; border-radius: 6px; cursor: pointer; transition: background-color 0.2s; }
    button:hover { background-color: #0056b3; }
    button.btn-secondary { background-color: #28a745; }
    button.btn-secondary:hover { background-color: #218838; }
    #message { margin-top: 20px; padding: 12px; border-radius: 6px; font-size: 14px; text-align: center; display: none; }
    .success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
    .error { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
    
    #dashboard { display: none; text-align: center; }
    .welcome-card { background: #e9ecef; padding: 20px; border-radius: 8px; margin-top: 20px; }
    .btn-logout { background-color: #dc3545; margin-top: 20px; width: 100%; }
    .btn-logout:hover { background-color: #c82333; }
  </style>
</head>
<body>

  <div class="container" id="auth-box">
    <h2>EDUSHOPING SaaS</h2>
    
    <div class="form-group">
      <label for="email">E-mail</label>
      <input type="email" id="email" placeholder="seu@email.com" required>
    </div>

    <div class="form-group">
      <label for="password">Senha</label>
      <input type="password" id="password" placeholder="Digite a sua senha" required>
    </div>

    <div class="btn-group">
      <button type="button" onclick="fazerLogin()">Entrar</button>
      <button type="button" class="btn-secondary" onclick="registar()">Criar Conta</button>
    </div>

    <div id="message"></div>
  </div>

  <div class="container" id="dashboard">
    <h2>EDUSHOPING SaaS</h2>
    <div class="welcome-card">
      <h3>Bem-vindo ao sistema! 🎉</h3>
      <p style="margin-top: 10px;" id="user-email-display"></p>
    </div>
    <button type="button" class="btn-logout" onclick="logout()">Sair</button>
  </div>

  <script>
    async function registar() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        exibirMensagem('Por favor, preencha o email e a senha.', 'error');
        return;
      }

      try {
        const response = await fetch('/register', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          entrarNoSistema(data.user.email);
        } else {
          exibirMensagem(data.erro || 'Erro ao criar conta.', 'error');
        }
      } catch (err) {
        exibirMensagem('Erro de conexão com o servidor.', 'error');
      }
    }

    async function fazerLogin() {
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      if (!email || !password) {
        exibirMensagem('Por favor, preencha o email e a senha.', 'error');
        return;
      }

      try {
        const response = await fetch('/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await response.json();

        if (response.ok) {
          entrarNoSistema(data.user.email);
        } else {
          exibirMensagem(data.erro || 'Credenciais inválidas.', 'error');
        }
      } catch (err) {
        exibirMensagem('Erro de conexão com o servidor.', 'error');
      }
    }

    function entrarNoSistema(email) {
      document.getElementById('auth-box').style.display = 'none';
      document.getElementById('dashboard').style.display = 'block';
      document.getElementById('user-email-display').innerText = 'Conectado como: ' + email;
    }

    function logout() {
      document.getElementById('dashboard').style.display = 'none';
      document.getElementById('auth-box').style.display = 'block';
      document.getElementById('message').style.display = 'none';
    }

    function exibirMensagem(texto, tipo) {
      const msgDiv = document.getElementById('message');
      msgDiv.innerText = texto;
      msgDiv.className = tipo;
      msgDiv.style.display = 'block';
    }
  </script>

</body>
</html>
